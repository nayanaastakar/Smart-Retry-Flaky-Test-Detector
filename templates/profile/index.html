{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Profile</h1>
    <p class="page-subtitle">Manage your account details and security.</p>
  </div>
</div>

<div class="grid grid-2col">
  <div class="card" style="margin-bottom:18px;">
    <div class="card-header"><h3 class="card-title"><i class="fa-solid fa-user"></i> Account Details</h3></div>
    <form method="POST" action="{{ url_for('profile.index') }}">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.full_name or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled>
        <p class="form-hint">Usernames cannot be changed.</p>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
    </form>
  </div>

  <div class="card" style="margin-bottom:18px;">
    <div class="card-header"><h3 class="card-title"><i class="fa-solid fa-lock"></i> Change Password</h3></div>
    <form method="POST" action="{{ url_for('profile.change_password') }}">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" name="old_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
